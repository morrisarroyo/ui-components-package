# Runs on every push and pull request to main. Each job is a Docker build or
# run, so CI here is the same as `npm run ci:docker` on any machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Tests and builds (Dockerfile.ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Lint, typecheck, tests and builds
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

  image:
    name: Hosted image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image Render deploys
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  secrets:
    name: No secrets in the history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every commit
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo
